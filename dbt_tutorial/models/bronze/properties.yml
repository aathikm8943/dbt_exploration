version: 2

models:
  - name: bronze_dim_date
    config:
      schema: bronze
      materialized: view
    description: "This table contains the raw date dimension data ingested from the source system."

  - name: bronze_dim_product
    config:
      schema: bronze
      materialized: view
    description: "This table contains the raw product dimension data ingested from the source system."
    columns:
      - name: product_sk
        data_tests:
          - not_null
          - unique

      - name: department
        data_tests:
          - accepted_values:
              arguments:
                values: ['Grocery', 'Electronics', 'Toys', 'Home', 'Health & Beauty']

  - name: bronze_dim_store
    config:
      schema: bronze
      materialized: view  
    description: "This view contains the raw store dimension data ingested from the source system."
    columns:
      - name: store_sk
        data_tests:
          - default_non_zero_test

  - name: bronze_fact_sales
    config:
      schema: bronze
      materialized: view
    description: "This table contains the raw sales fact data ingested from the source system."

  - name: bronze_dim_customer
    config:
      schema: bronze
      materialized: view
    description: "This table contains the raw customer dimension data ingested from the source system."

  - name: bronze_fact_returns
    config:
      schema: bronze
      materialized: view
    description: "This table contains the raw returns fact data ingested from the source system."
    